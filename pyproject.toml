[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servercheck"
version = "0.1.0"
description = "CLI utility to evaluate server CPU status"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
servercheck = "servercheck.cli:cli"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]